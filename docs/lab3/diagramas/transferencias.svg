<text x="35" y="965" font-family="sans-serif" font-size="15" fill="#475569">Flechas: dependencia de código hacia contratos y reglas. Main ensambla los adaptadores.</text>
<text x="35" y="988" font-family="sans-serif" font-size="15" fill="#475569">El núcleo (aplicación, dominio y puertos) no importa implementaciones de infraestructura.</text>
